# pnpm 12 settings. A single root package: no `packages` field.
nodeLinker: hoisted
saveExact: true
autoInstallPeers: true
strictPeerDependencies: false
engineStrict: true

# Only electron (binary download) and esbuild (native binary) run
# their install scripts. better-sqlite3 ships `prebuilds/darwin-arm64.node`
# (N-API): its `binding.gyp` must NOT trigger node-gyp. electron-winstaller
# (Windows, pulled in by electron-builder) and simple-git-hooks (handled by `prepare`) are refused.
allowBuilds:
  better-sqlite3: false
  electron: true
  electron-winstaller: false
  esbuild: true
  simple-git-hooks: false

supportedArchitectures:
  os:
    - darwin
  cpu:
    - arm64
