<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>RecoltOS</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main id="app" aria-live="polite">
      <header class="head">
        <img class="logo" src="icons/32.png" alt="" width="20" height="20" />
        <span class="brand">RecoltOS</span>
        <span id="status" class="pill" data-state="connecting"><i></i><span>Connexion…</span></span>
      </header>
      <p id="statusHint" class="hint" hidden></p>
      <section id="save">
        <div class="preview">
          <img id="shot" alt="" hidden /><span id="noshot">Aperçu indisponible</span>
        </div>
        <input id="title" class="field" type="text" placeholder="Titre" aria-label="Titre" />
        <div class="row">
          <button id="savePage" class="btn primary" type="button">Enregistrer la page</button>
          <button id="saveImage" class="btn ghost" type="button" hidden>
            Image principale seulement
          </button>
        </div>
        <label class="label" for="search">Collection</label>
        <input id="search" class="field" type="search" placeholder="Rechercher une collection" />
        <ul id="collections" class="list" role="listbox" aria-label="Collections"></ul>
        <button id="newCollection" class="link" type="button">+ Nouvelle collection</button>
        <label class="label" for="note">Note</label>
        <textarea id="note" class="field note" rows="2" placeholder="Ajouter une note"></textarea>
        <p id="result" class="result" hidden></p>
      </section>
      <footer class="foot">
        <div id="sync" class="sync"></div>
        <div class="row">
          <button id="syncNow" class="link" type="button">Synchroniser maintenant</button>
          <button id="grant" class="link" type="button" hidden>Autoriser l’accès aux sites</button>
        </div>
        <p class="tiny">La synchro tourne en arrière-plan tant que ce navigateur est ouvert.</p>
      </footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
