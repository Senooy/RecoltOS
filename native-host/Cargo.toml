[package]
name = "recolt-host"
version = "1.0.0"
edition = "2021"
publish = false
license = "MIT"
description = "RecoltOS native messaging host: relays the browser extension to the app's local socket"

[[bin]]
name = "recolt-host"
path = "src/main.rs"

# No dependencies: std only (JSON is scanned, never deserialized into a tree).
[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
# Stripped by `scripts/build-host.mts` with Apple's `strip` (rustc uses `rust-objcopy`, whose
# libLLVM is missing in some rustup toolchains).
strip = false
debug = false
